# API Contract: Authentication Endpoints

## Base URL
```
Frontend (Better Auth): /api/auth
Backend (FastAPI): /api/v1
```

## Frontend Authentication Endpoints (Better Auth)

### 1. Sign Up
```
POST /api/auth/sign-up/email
```

#### Request
**Body:**
```json
{
  "email": "string (required)",
  "password": "string (required, min 8 characters)",
  "name": "string (optional)"
}
```

#### Responses
- `200 OK`: Account created successfully
```json
{
  "user": {
    "id": "uuid-string",
    "email": "user@example.com",
    "name": "User Name"
  },
  "session": {
    "id": "session-id",
    "expiresAt": "2023-01-08T12:00:00Z"
  }
}
```
- `400 Bad Request`: Invalid input data
- `422 Unprocessable Entity`: Email already exists

---

### 2. Sign In
```
POST /api/auth/sign-in/email
```

#### Request
**Body:**
```json
{
  "email": "string (required)",
  "password": "string (required)"
}
```

#### Responses
- `200 OK`: Authentication successful
```json
{
  "user": {
    "id": "uuid-string",
    "email": "user@example.com",
    "name": "User Name"
  },
  "session": {
    "id": "session-id",
    "expiresAt": "2023-01-08T12:00:00Z"
  }
}
```
- `401 Unauthorized`: Invalid credentials

---

### 3. Get JWT Token
```
GET /api/auth/token
```

#### Request
**Headers:**
- Cookie: Session cookie from sign-in

#### Responses
- `200 OK`: Token issued
```json
{
  "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
}
```
- `401 Unauthorized`: No active session

---

### 4. Sign Out
```
POST /api/auth/sign-out
```

#### Request
**Headers:**
- Cookie: Session cookie

#### Responses
- `200 OK`: Signed out successfully
- `401 Unauthorized`: No active session

---

### 5. Get Session
```
GET /api/auth/session
```

#### Request
**Headers:**
- Cookie: Session cookie

#### Responses
- `200 OK`: Session active
```json
{
  "user": {
    "id": "uuid-string",
    "email": "user@example.com",
    "name": "User Name"
  },
  "session": {
    "id": "session-id",
    "expiresAt": "2023-01-08T12:00:00Z"
  }
}
```
- `401 Unauthorized`: No active session

---

## Backend Protected Endpoints (FastAPI)

All backend endpoints require JWT authentication:

### Common Headers
```
Authorization: Bearer <jwt-token>
Content-Type: application/json
```

### Error Responses

#### 401 Unauthorized
Returned when:
- No Authorization header present
- Token is malformed
- Token signature is invalid
- Token is expired

```json
{
  "detail": "Could not validate credentials"
}
```

#### 403 Forbidden
Returned when:
- User attempts to access another user's resource
- Note: May return 404 instead to prevent enumeration

```json
{
  "detail": "Access denied"
}
```

---

## JWT Token Structure

### Header
```json
{
  "alg": "HS256",
  "typ": "JWT"
}
```

### Payload
```json
{
  "sub": "user-uuid",
  "email": "user@example.com",
  "iat": 1704715200,
  "exp": 1704801600,
  "iss": "http://localhost:3000"
}
```

### Verification
- Algorithm: HS256
- Secret: Shared between frontend and backend via environment variables
- Expiration: 24 hours from issuance

---

## Protected Task Endpoints

The following existing endpoints from Spec 1 now require JWT authentication:

| Method | Endpoint | Auth Required |
|--------|----------|---------------|
| POST | /api/v1/users/{user_id}/tasks | Yes - user_id must match token |
| GET | /api/v1/users/{user_id}/tasks | Yes - user_id must match token |
| GET | /api/v1/users/{user_id}/tasks/{task_id} | Yes - user_id must match token |
| PUT | /api/v1/users/{user_id}/tasks/{task_id} | Yes - user_id must match token |
| DELETE | /api/v1/users/{user_id}/tasks/{task_id} | Yes - user_id must match token |
| PATCH | /api/v1/users/{user_id}/tasks/{task_id}/complete | Yes - user_id must match token |

### User ID Validation
- The `user_id` in the URL path must match the `sub` claim from the JWT token
- Mismatched user IDs return 403 Forbidden or 404 Not Found

---

## Environment Variables

### Frontend (.env.local)
```
BETTER_AUTH_SECRET=<32-character-secret>
BETTER_AUTH_URL=http://localhost:3000
DATABASE_URL=<neon-postgresql-connection-string>
```

### Backend (.env)
```
SECRET_KEY=<same-32-character-secret-as-frontend>
ALGORITHM=HS256
ACCESS_TOKEN_EXPIRE_MINUTES=1440
DATABASE_URL=<neon-postgresql-connection-string>
```

**CRITICAL**: `BETTER_AUTH_SECRET` and `SECRET_KEY` must be identical for JWT verification to work.
