## Loading States

### 1. Initial Page Load
Display skeleton screens:
```
┌─────────────────────────────────┐
│ ░░░░░░░░░░░░░░░░░░░    [░░][░░]│
│ ░░░░░░░░░░░░░░              │
└─────────────────────────────────┘
```

### 2. Task Action (Toggle, Delete)
Show spinner on affected element:
```
☐ Task Title  ⟳  [Edit][Delete]
```

### 3. Form Submission
Disable button with loading text:
```
[Creating...] (disabled)
```

