# API Contract: Task Management Endpoints

## Base URL
```
/api
```

## Authentication
No authentication required for this specification (to be added in future spec).

## Common Headers
```
Content-Type: application/json
Accept: application/json
```

## Error Responses
All error responses follow this structure:
```json
{
  "detail": "Human-readable error message",
  "error_code": "SYSTEM_DEFINED_ERROR_CODE"
}
```

## Endpoints

### 1. Create Task
```
POST /users/{user_id}/tasks
```

#### Request
**Path Parameters:**
- `user_id` (integer, required): The ID of the user creating the task

**Body:**
```json
{
  "title": "string (required)",
  "description": "string (optional, max 1000 characters)",
  "completed": "boolean (optional, default false)"
}
```

#### Responses
- `201 Created`: Task created successfully
```json
{
  "id": 123,
  "title": "Task title",
  "description": "Task description",
  "completed": false,
  "user_id": 456,
  "created_at": "2023-01-01T12:00:00Z",
  "updated_at": "2023-01-01T12:00:00Z"
}
```
- `400 Bad Request`: Invalid input data
- `422 Unprocessable Entity`: Validation errors

### 2. Get All User Tasks
```
GET /users/{user_id}/tasks
```

#### Request
**Path Parameters:**
- `user_id` (integer, required): The ID of the user whose tasks to retrieve

#### Responses
- `200 OK`: Successfully retrieved tasks
```json
{
  "tasks": [
    {
      "id": 123,
      "title": "Task title",
      "description": "Task description",
      "completed": false,
      "user_id": 456,
      "created_at": "2023-01-01T12:00:00Z",
      "updated_at": "2023-01-01T12:00:00Z"
    }
  ]
}
```
- `404 Not Found`: User ID does not exist

### 3. Get Specific Task
```
GET /users/{user_id}/tasks/{task_id}
```

#### Request
**Path Parameters:**
- `user_id` (integer, required): The ID of the user who owns the task
- `task_id` (integer, required): The ID of the task to retrieve

#### Responses
- `200 OK`: Successfully retrieved task
```json
{
  "id": 123,
  "title": "Task title",
  "description": "Task description",
  "completed": false,
  "user_id": 456,
  "created_at": "2023-01-01T12:00:00Z",
  "updated_at": "2023-01-01T12:00:00Z"
}
```
- `404 Not Found`: Task or user ID does not exist, or task does not belong to user

### 4. Update Task
```
PUT /users/{user_id}/tasks/{task_id}
```

#### Request
**Path Parameters:**
- `user_id` (integer, required): The ID of the user who owns the task
- `task_id` (integer, required): The ID of the task to update

**Body:**
```json
{
  "title": "string (required)",
  "description": "string (optional, max 1000 characters)",
  "completed": "boolean (optional)"
}
```

#### Responses
- `200 OK`: Task updated successfully
```json
{
  "id": 123,
  "title": "Updated task title",
  "description": "Updated task description",
  "completed": true,
  "user_id": 456,
  "created_at": "2023-01-01T12:00:00Z",
  "updated_at": "2023-01-02T12:00:00Z"
}
```
- `400 Bad Request`: Invalid input data
- `404 Not Found`: Task or user ID does not exist, or task does not belong to user
- `422 Unprocessable Entity`: Validation errors

### 5. Delete Task
```
DELETE /users/{user_id}/tasks/{task_id}
```

#### Request
**Path Parameters:**
- `user_id` (integer, required): The ID of the user who owns the task
- `task_id` (integer, required): The ID of the task to delete

#### Responses
- `204 No Content`: Task deleted successfully
- `404 Not Found`: Task or user ID does not exist, or task does not belong to user

### 6. Complete Task
```
PATCH /users/{user_id}/tasks/{task_id}/complete
```

#### Request
**Path Parameters:**
- `user_id` (integer, required): The ID of the user who owns the task
- `task_id` (integer, required): The ID of the task to mark as complete

**Body:**
```json
{
  "completed": true
}
```

#### Responses
- `200 OK`: Task completion status updated successfully
```json
{
  "id": 123,
  "title": "Task title",
  "description": "Task description",
  "completed": true,
  "user_id": 456,
  "created_at": "2023-01-01T12:00:00Z",
  "updated_at": "2023-01-02T12:00:00Z"
}
```
- `400 Bad Request`: Invalid input data
- `404 Not Found`: Task or user ID does not exist, or task does not belong to user
- `422 Unprocessable Entity`: Validation errors